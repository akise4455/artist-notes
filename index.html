:root {
  --ink: #182026;
  --muted: #606b75;
  --purple: #245b52;
  --pale: #eaf1ee;
  --border: #e1e5e9;
  --bg: #f7f8fa;
  --paper: #fff;
}

body { font-family: 'Noto Sans KR', system-ui, sans-serif; }
.page { max-width: 1232px; padding: 0 40px; }
.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 58px 0 30px;
}
.gallery-header h1 { font-size: 33px; line-height: 1.25; letter-spacing: -.035em; }
.gallery-header p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.gallery-link { font-size: 13px; color: var(--purple); white-space: nowrap; }
.gallery-link:hover, .text-btn:hover, .footer-actions button:hover { text-decoration: underline; }
.collection { border: 0; padding: 0 0 40px; }
.search-row { gap: 10px; }
.search { height: 48px; border-radius: 8px; padding: 0 14px; }
.search svg { stroke: #687580; }
.search input { font-size: 14px; }
.search input::placeholder { color: #687580; }
.search:focus-within { border-color: #659087; box-shadow: 0 0 0 3px #dce9e5; }
select { color: #37434e; border-radius: 8px; }
.collection-heading { margin: 16px 0 0; border-bottom: 1px solid var(--border); }
.tabs { gap: 22px; }
.category-tabs { display: flex; gap: 8px; margin: 0 0 14px; }
.cat { background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 600; color: var(--muted); }
.cat span { margin-left: 6px; font-size: 12px; font-weight: 500; opacity: .8; }
.cat.active { background: var(--purple); border-color: var(--purple); color: #fff; }
.field select { display: block; width: 100%; height: 42px; margin: 8px 0 5px; }
.tab { font-size: 14px; color: var(--muted); padding: 12px 0; }
.tab.active { color: var(--ink); }
.tab.active::after { background: var(--purple); bottom: -1px; }
.tab span, .tab.active span { background: #e9edf0; color: #4d5a65; }
.result-row, .result-row p { color: var(--muted); }
.result-row { margin: 17px 0 12px; }
.result-row strong { color: var(--ink); }
.primary { background: var(--purple); box-shadow: none; }
.primary:hover { background: #19463f; }
.secondary { color: #34424b; background: #f2f4f6; border-color: var(--border); }
button:focus-visible, a:focus-visible, select:focus-visible { outline-color: #659087; }

.grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.public-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.pagination { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 24px; }
.pagination span { color: var(--muted); font-size: 13px; }
.pagination button:disabled { cursor: default; }
.card { border-radius: 9px; transition: border-color .15s; }
.card:hover { border-color: #aebcb9; box-shadow: none; transform: none; }
.image-wrap { padding: 0; }
.image-btn { aspect-ratio: 4 / 4.6; border-radius: 0; background: #eef1f3; }
.placeholder { background: #eef1f3; color: #626f7a; }
.placeholder::before, .placeholder::after,
.placeholder .big, .placeholder .line, .placeholder .caption { display: none; }
.placeholder small { color: #626f7a; opacity: 1; font-size: 11px; margin: 0; }
.fav {
  right: 10px;
  top: 10px;
  width: 33px;
  height: 33px;
  border: 1px solid #dde3e6;
  background: #fff;
  color: #52606b;
}
.fav.selected { color: var(--purple); }
.card-body { padding: 13px 14px 15px; }
.card-number { display: none; }
.tag-name { font-size: 15px; color: var(--ink); }
.tag-name svg { stroke: #687580; }
.tag-name:hover, .edit-btn { color: var(--purple); }
.card-note { color: var(--muted); white-space: normal; font-size: 12px; overflow-wrap: anywhere; }
.chips { margin-top: 8px; }
.chip { background: #eef1f3; color: #53606b; font-size: 10px; }

.empty, .empty h2 { color: var(--muted); }
.empty > span { display: none; }
.tip { padding: 17px 18px; margin: 24px 0 0; background: #fff; border-color: var(--border); }
.tip p { color: var(--muted); font-size: 12px; }
.tip strong { color: var(--ink); font-weight: 600; }
.publish-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
.text-btn, .footer-actions button { color: var(--purple); font-size: 12px; }
.tip .text-btn { margin-left: 0; }
footer p, footer span, footer strong { color: var(--muted); font-size: 12px; }
footer { padding: 16px 0 24px; }
.icon-btn { background: #eef1f3; color: #52606b; }
.dialog-heading .eyebrow { display: none; }
.field, .field small, .help-body p, #viewNote { color: var(--muted); }
.field input, .field textarea, #copyText { background: #fff; border-color: var(--border); }
.field input:focus, .field textarea:focus { border-color: #659087; }
.upload { background: #f7f8fa; border-color: #b4bdc4; }
.upload-label b, .help-body b { color: var(--purple); }
.upload-label span { color: var(--muted); }
.danger { color: #a53b4f; }
.toast { background: #253b37; }

@media (max-width: 900px) {
  .page { padding: 0 28px; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 620px) {
  .page { padding: 0 16px; }
  .gallery-header { padding: 34px 0 20px; }
  .gallery-header h1 { font-size: 28px; }
  .gallery-header p, .gallery-link { font-size: 12px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tabs { gap: 14px; }
  .tab, .search input { font-size: 12px; }
  .search-row { gap: 6px; }
  .search { height: 43px; padding: 0 9px; }
  .card-body { padding: 11px; }
  .tag-name { font-size: 13px; }
  .fav { right: 7px; top: 7px; width: 30px; height: 30px; }
  .tip { align-items: flex-start; flex-direction: column; }
}
</style>
</head>

<div class="page">
  <header class="gallery-header"><div><h1>작태 노트</h1><p>작가 태그를 찾고, 이름을 눌러 복사하세요.</p></div></header>
  <main>
    <section class="collection" aria-label="작가 태그 모음">
      <div class="category-tabs" role="group" aria-label="캐릭터 분류"><button class="cat active" data-cat="female" aria-pressed="true">여캐 <span id="cnt-female">0</span></button><button class="cat" data-cat="male" aria-pressed="false">남캐 <span id="cnt-male">0</span></button></div>
      <div class="search-row"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input type="search" id="search" placeholder="작가 이름, 태그, 메모로 찾아보세요" aria-label="작가 이름, 태그, 메모 검색"></label><select id="sort" aria-label="정렬"><option value="new">최근 추가순</option><option value="name">이름순 A–Z</option><option value="old">오래된순</option></select></div>
<div class="collection-heading"><div class="tabs" role="group" aria-label="보기 선택"><button class="tab active" id="allTab" aria-pressed="true">전체 모음 <span id="allCount">0</span></button><button class="tab" id="favTab" aria-pressed="false">♡ 즐겨찾기 <span id="favCount">0</span></button></div></div>
      <div class="result-row"><p id="resultCount" aria-live="polite"></p></div>
      <div class="grid public-grid" id="grid"></div><nav class="pagination" aria-label="페이지 이동" id="pagination" hidden><button class="secondary" id="prevPage">이전</button><span id="pageLabel" aria-live="polite"></span><button class="secondary" id="nextPage">다음</button></nav>
      <div class="empty" id="empty" hidden><span>✧</span><h2 id="emptyTitle">아직 모아둔 태그가 없어요</h2><p id="emptyText">첫 번째 취향을 기록해 보세요.</p><button class="secondary" id="emptyAction">태그 추가하기</button></div>
    </section>
  </main>
  <footer><p>즐겨찾기는 현재 브라우저에 저장돼요.</p></footer>
</div>
<dialog id="viewer"><div class="dialog-heading"><div><p class="eyebrow">ARTIST PREVIEW</p><h2 id="viewTitle"></h2></div><button class="icon-btn" data-close="viewer" aria-label="닫기">×</button></div><div id="viewImage"></div><p id="viewNote"></p><div class="dialog-actions"><button class="primary" id="viewCopy">태그 복사</button></div></dialog>
<dialog id="copyDialog"><div class="dialog-heading"><h2>태그 복사</h2><button class="icon-btn" data-close="copyDialog" aria-label="닫기">×</button></div><p>아래 태그를 선택해 복사해 주세요.</p><textarea id="copyText" readonly rows="3" aria-label="복사할 태그"></textarea></dialog>
<div class="toast" id="toast" role="status"></div>
<script>'use strict';

const element = (id) => document.getElementById(id);
const favoriteKey = 'artist-notes-public-favorites';
const pageSize = 5 * 20;
let currentPage = 1;
let entries = [];
let favorites = new Set();
let filterFavorites = false;
let category = 'female';
try { if (localStorage.getItem('artist-notes-public-category') === 'male') category = 'male'; } catch { /* 기본은 여캐 */ }
if (location.hash === '#male') category = 'male';
if (location.hash === '#female') category = 'female';
let loadState = 'loading';
let viewedEntry;
let toastTimer;

try {
  const saved = JSON.parse(localStorage.getItem(favoriteKey) || '[]');
  if (Array.isArray(saved)) favorites = new Set(saved);
} catch { /* The gallery also works when local storage is unavailable. */ }

function create(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function parseEntries(data) {
  if (!Array.isArray(data?.entries)) throw new Error('Invalid collection');
  const seen = new Set();
  return data.entries.flatMap((entry, index) => {
    if (typeof entry?.tag !== 'string' || !entry.tag.trim()) return [];
    const tag = entry.tag.trim();
    const cat = entry.category === 'male' ? 'male' : 'female';
    const key = (cat === 'male' ? 'male:' : '') + tag.toLowerCase();
    if (seen.has(key)) return [];
    seen.add(key);
    const labels = Array.isArray(entry.labels) ? entry.labels.filter((label) => typeof label === 'string') : [];
    const note = typeof entry.note === 'string' ? entry.note : '';
    const safeImage = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
    const imageFile = /^https:\/\/[a-z0-9-]+\.public\.blob\.vercel-storage\.com\/images\/[A-Za-z0-9_-]+\.(jpg|png|webp)$/;
    const image = typeof entry.image === 'string' && (imageFile.test(entry.image) || safeImage.test(entry.image)) ? entry.image : '';
    const created = Number.isFinite(entry.created) ? entry.created : -index;
    return [{ tag, key, category: cat, labels, note, image, created, index, sample: entry.sample === true }];
  });
}

function showToast(message) {
  element('toast').textContent = message;
  element('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => element('toast').classList.remove('show'), 2800);
}

async function copy(tag) {
  try {
    await navigator.clipboard.writeText(tag);
    showToast(`${tag} · 복사했어요`);
  } catch {
    const field = element('copyText');
    field.value = tag;
    element('copyDialog').showModal();
    field.select();
  }
}

function imageContent(entry) {
  if (entry.image) {
    const image = create('img');
    image.src = entry.image;
    image.alt = `${entry.tag} 비교 이미지`;
    image.loading = 'lazy';
    return image;
  }
  const placeholder = create('div', `placeholder tone-${entry.index % 6}`);
  placeholder.append(create('span', 'big', '✧'), create('small', '', '등록된 이미지 없음'));
  return placeholder;
}

function toggleFavorite(entry, button) {
  if (favorites.has(entry.key)) favorites.delete(entry.key);
  else favorites.add(entry.key);
  try { localStorage.setItem(favoriteKey, JSON.stringify([...favorites])); }
  catch { showToast('이 브라우저에서 즐겨찾기를 저장할 수 없어요.'); }
  render();
  const matchingButton = Array.from(element('grid').querySelectorAll('.fav'))
    .find((item) => item.getAttribute('aria-label') === button.getAttribute('aria-label'));
  (matchingButton || element('favTab')).focus();
}

function openViewer(entry) {
  viewedEntry = entry;
  element('viewTitle').textContent = entry.tag;
  element('viewNote').textContent = entry.note;
  element('viewNote').hidden = !entry.note;
  element('viewImage').replaceChildren(imageContent(entry));
  element('viewer').showModal();
}

function renderCard(entry) {
  const card = create('article', 'card');
  const imageWrap = create('div', 'image-wrap');
  const imageButton = create('button', 'image-btn');
  imageButton.setAttribute('aria-label', `${entry.tag} 크게 보기`);
  imageButton.append(imageContent(entry));
  imageButton.onclick = () => openViewer(entry);
  const selected = favorites.has(entry.key);
  const favorite = create('button', `fav${selected ? ' selected' : ''}`, selected ? '♥' : '♡');
  favorite.setAttribute('aria-label', `${entry.tag} 즐겨찾기`);
  favorite.setAttribute('aria-pressed', String(selected));
  favorite.onclick = () => toggleFavorite(entry, favorite);
  imageWrap.append(imageButton, favorite);
  const body = create('div', 'card-body');
  const name = create('button', 'tag-name');
  name.setAttribute('aria-label', `${entry.tag} 태그 복사`);
  name.append(create('span', '', entry.tag));
  name.onclick = () => copy(entry.tag);
  body.append(name);
  if (entry.note) body.append(create('p', 'card-note', entry.note));
  if (entry.sample || entry.labels.length) {
    const chips = create('div', 'chips');
    const labels = new Set(entry.sample ? ['예시 태그', ...entry.labels] : entry.labels);
    for (const label of [...labels].slice(0, 3)) chips.append(create('span', 'chip', label));
    body.append(chips);
  }
  card.append(imageWrap, body);
  return card;
}

function render() {
  const query = element('search').value.trim().toLowerCase();
  const inCategory = entries.filter((entry) => entry.category === category);
  const list = inCategory.filter((entry) => (!filterFavorites || favorites.has(entry.key)) &&
    [entry.tag, ...entry.labels, entry.note].join(' ').toLowerCase().includes(query));
  const sort = element('sort').value;
  if (sort === 'name') list.sort((a, b) => a.tag.localeCompare(b.tag));
  else if (sort === 'old') list.sort((a, b) => a.created - b.created);
  else list.sort((a, b) => b.created - a.created);

  element('allCount').textContent = inCategory.length;
  element('favCount').textContent = inCategory.filter((entry) => favorites.has(entry.key)).length;
  for (const button of document.querySelectorAll('.cat')) {
    const active = button.dataset.cat === category;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
    button.querySelector('span').textContent = entries.filter((entry) => entry.category === button.dataset.cat).length;
  }
  element('resultCount').textContent = loadState === 'ready' ? `${query ? '검색 결과' : '총'} ${list.length}개` : '';
  const pageCount = Math.max(1, Math.ceil(list.length / pageSize));
  currentPage = Math.min(currentPage, pageCount);
  const start = (currentPage - 1) * pageSize;
  element('grid').replaceChildren(...list.slice(start, start + pageSize).map(renderCard));
  element('pagination').hidden = pageCount <= 1;
  element('pageLabel').textContent = `${currentPage} / ${pageCount} 페이지`;
  element('prevPage').disabled = currentPage === 1;
  element('nextPage').disabled = currentPage === pageCount;
  element('empty').hidden = list.length > 0;
  const action = element('emptyAction');
  action.hidden = true;
  element('emptyText').textContent = '';
  if (loadState === 'loading') element('emptyTitle').textContent = '작태 목록을 불러오는 중이에요';
  else if (loadState === 'error') {
    element('emptyTitle').textContent = '작태 목록을 불러오지 못했어요';
    action.hidden = false;
    action.textContent = '다시 불러오기';
    action.onclick = loadCollection;
  } else if (query) {
    element('emptyTitle').textContent = '일치하는 태그가 없어요';
    action.hidden = false;
    action.textContent = '검색 지우기';
    action.onclick = () => { element('search').value = ''; resetPage(); element('search').focus(); };
  } else if (filterFavorites) {
    element('emptyTitle').textContent = '아직 즐겨찾기가 없어요';
    element('emptyText').textContent = '카드의 하트를 눌러 즐겨찾기에 추가해 보세요.';
  } else element('emptyTitle').textContent = '아직 공개된 태그가 없어요';
}

function selectTab(showFavorites) {
  filterFavorites = showFavorites;
  for (const [id, active] of [['allTab', !showFavorites], ['favTab', showFavorites]]) {
    element(id).classList.toggle('active', active);
    element(id).setAttribute('aria-pressed', String(active));
  }
  resetPage();
}

function selectCategory(next) {
  category = next === 'male' ? 'male' : 'female';
  try { localStorage.setItem('artist-notes-public-category', category); } catch { /* 저장 못 해도 보기는 된다 */ }
  history.replaceState(null, '', '#' + category);
  resetPage();
}
document.querySelectorAll('.cat').forEach((button) => { button.onclick = () => selectCategory(button.dataset.cat); });

function resetPage() {
  currentPage = 1;
  render();
}

function turnPage(step) {
  currentPage = Math.max(1, currentPage + step);
  render();
  const nextControl = element(step > 0 ? 'nextPage' : 'prevPage');
  const otherControl = element(step > 0 ? 'prevPage' : 'nextPage');
  (nextControl.disabled ? otherControl : nextControl).focus({ preventScroll: true });
  element('resultCount').scrollIntoView({ block: 'start' });
}

async function loadCollection() {
  loadState = 'loading';
  render();
  try {
    let data = null;
    try {
      const live = await fetch('/api/collection');
      if (live.ok) data = await live.json();
    } catch { /* 아래의 예전 목록으로 대신 보여준다 */ }
    if (!data || data.empty || !Array.isArray(data.entries)) {
      const response = await fetch('./collection.json', { cache: 'no-cache' });
      if (!response.ok) throw new Error('Collection unavailable');
      data = await response.json();
    }
    entries = parseEntries(data);
    loadState = 'ready';
  } catch { loadState = 'error'; }
  render();
}

element('allTab').onclick = () => selectTab(false);
element('favTab').onclick = () => selectTab(true);
element('search').oninput = resetPage;
element('sort').onchange = resetPage;
element('prevPage').onclick = () => turnPage(-1);
element('nextPage').onclick = () => turnPage(1);
element('viewCopy').onclick = () => { if (viewedEntry) copy(viewedEntry.tag); };
document.querySelectorAll('[data-close]').forEach((button) => {
  button.onclick = () => element(button.dataset.close).close();
});
document.addEventListener('keydown', (event) => {
  if (event.key !== '/' || document.querySelector('dialog[open]')) return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  event.preventDefault();
  element('search').focus();
});

loadCollection();
</script>
</body></html>
